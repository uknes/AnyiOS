name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: gcc
          - os: ubuntu-latest
            preset: clang
          - os: windows-latest
            preset: msvc
          - os: macos-latest
            preset: clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.preset }}" = gcc ]; then
            cmake -S . -B build -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          elif [ "${{ matrix.preset }}" = clang ] && [ "${{ runner.os }}" = Linux ]; then
            cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          fi
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
      - name: Compiler-generated ARM64 fixture
        if: runner.os == 'Linux' && matrix.preset == 'clang'
        run: python3 tests/real_fixture.py build/anyios-inspect

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DANYIOS_BUILD_FUZZER=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --target anyios-fuzz --parallel 2
      - name: Seed corpus
        run: python3 tests/fuzz_corpus.py build/fuzz-corpus
      - name: Fuzz with ASan and UBSan
        run: ./build/anyios-fuzz build/fuzz-corpus -runs=15000 -max_len=4096 -timeout=3 -print_final_stats=1

  windows-a64-translation:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure ARM64 translator
        run: cmake -S . -B build-jit -DANYIOS_WITH_DYNARMIC=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build guest code runner
        run: cmake --build build-jit --config Release --target anyios-a64-smoke --parallel 2
      - name: Execute ARM64 guest instructions on Windows x64
        run: ctest --test-dir build-jit --build-config Release -R "^arm64-on-x64$" --output-on-failure
