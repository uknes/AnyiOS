name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: gcc
          - os: ubuntu-latest
            preset: clang
          - os: windows-latest
            preset: msvc
          - os: macos-latest
            preset: clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.preset }}" = gcc ]; then
            cmake -S . -B build -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          elif [ "${{ matrix.preset }}" = clang ] && [ "${{ runner.os }}" = Linux ]; then
            cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          fi
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
      - name: Compiler-linked iOS executable and dylib fixtures
        if: runner.os == 'macOS'
        run: python3 tests/linked_ios_fixture.py build/anyios-inspect
      - name: Compiler-generated ARM64 fixture
        if: runner.os == 'Linux' && matrix.preset == 'clang'
        run: python3 tests/real_fixture.py build/anyios-inspect

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DANYIOS_BUILD_FUZZER=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --target anyios-fuzz --parallel 2
      - name: Seed corpus
        run: python3 tests/fuzz_corpus.py build/fuzz-corpus
      - name: Fuzz with ASan and UBSan
        run: ./build/anyios-fuzz build/fuzz-corpus -runs=15000 -max_len=4096 -timeout=3 -print_final_stats=1

  windows-a64-translation:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Boost headers
        shell: pwsh
        run: |
          nuget install boost -Version 1.87.0 -OutputDirectory "$env:RUNNER_TEMP\anyios-deps" -ExcludeVersion -NonInteractive
          $found = Get-ChildItem -Path "$env:RUNNER_TEMP\anyios-deps\boost" -Filter version.hpp -Recurse | Where-Object { $_.Directory.Name -eq 'boost' } | Select-Object -First 1
          if (-not $found) { throw 'NuGet Boost package did not contain boost/version.hpp' }
          $include = Split-Path -Parent $found.Directory.FullName
          "BOOST_INCLUDEDIR=$include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure ARM64 translator
        run: cmake -S . -B build-jit -DANYIOS_WITH_DYNARMIC=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DBoost_NO_BOOST_CMAKE=ON -DBoost_INCLUDE_DIR="$env:BOOST_INCLUDEDIR"
      - name: Build guest code runner
        run: cmake --build build-jit --config Release --target anyios-a64-smoke --parallel 2
      - name: Execute ARM64 guest instructions on Windows x64
        run: ctest --test-dir build-jit --build-config Release -R "^arm64-on-x64$" --output-on-failure
      - name: Compile project-owned ARM64 Mach-O object
        shell: pwsh
        run: |
          & "C:\Program Files\LLVM\bin\clang.exe" --target=arm64-apple-ios13.0 -O2 -ffreestanding -c tests/fixtures/arm64_sample.c -o build-jit/owned-arm64.o
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 Mach-O compilation failed' }
      - name: Compile owned ARM64 Darwin SVC Mach-O sample
        shell: pwsh
        run: |
          & "C:\Program Files\LLVM\bin\clang.exe" --target=arm64-apple-ios13.0 -c tests/fixtures/arm64_syscall.S -o build-jit/owned-arm64-syscall.o
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 SVC Mach-O compilation failed' }
      - name: Execute guest Darwin syscall on Windows x64
        shell: pwsh
        run: |
          & ./build-jit/Release/anyios-a64-smoke.exe --syscall build-jit/owned-arm64-syscall.o
          if ($LASTEXITCODE -ne 0) { throw 'Guest Darwin syscall test failed' }
      - name: Execute compiled ARM64 Mach-O function on Windows x64
        shell: pwsh
        run: |
          & ./build-jit/Release/anyios-a64-smoke.exe build-jit/owned-arm64.o
          if ($LASTEXITCODE -ne 0) { throw 'Owned Mach-O function execution failed' }


  linked-ios-artifact:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure inspector
        run: cmake -S . -B build-fixture -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Build inspector
        run: cmake --build build-fixture --target anyios-inspect --parallel 2
      - name: Independently link project-owned iPhoneOS images
        run: python3 tests/linked_ios_fixture.py build-fixture/anyios-inspect build-fixture/owned-linked
      - name: Publish only project-owned Mach-O fixtures
        uses: actions/upload-artifact@v4
        with:
          name: anyios-linked-ios-owned
          path: build-fixture/owned-linked/
          if-no-files-found: error
          retention-days: 3

  windows-linked-inspection:
    needs: linked-ios-artifact
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download identical iPhoneOS linker outputs
        uses: actions/download-artifact@v4
        with:
          name: anyios-linked-ios-owned
          path: linked-images
      - name: Configure Windows inspector
        run: cmake -S . -B build-linked -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Build Windows inspector
        run: cmake --build build-linked --config Release --target anyios-inspect --parallel 2
      - name: Validate the linked iOS executable and dylib on Windows
        shell: pwsh
        run: |
          $inspector = "./build-linked/Release/anyios-inspect.exe"
          $app = & $inspector linked-images/SampleApp
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect genuine iOS executable on Windows" }
          $library = & $inspector linked-images/libWidget.dylib
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect genuine iOS dylib on Windows" }
          if (-not (($app -match "File type: 2") -and ($app -match "Dylib: @rpath/libWidget.dylib") -and
                    ($library -match "File type: 6") -and ($library -match "Install name: @rpath/libWidget.dylib"))) {
              throw "Incorrect genuine iPhoneOS dependency metadata on Windows"
          }
          Write-Output "Windows x86-64 successfully inspected the exact original iPhoneOS linked binaries"
